<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Básica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>CALCULADORA</h1>

    <div class="input-group">
      <label for="numero1">Primer Numero:</label>
      <input type="number" id="numero1" placeholder="Ingresa el primer número">
    </div>

    <div class="input-group">
      <label for="numero2">Segundo Numero:</label>
      <input type="number" id="numero2" placeholder="Ingresa el segundo número">
    </div>

    <div class="buttons">
      <button class="sumar" onclick="calcular('sumar')">Sumar</button>
      <button class="restar" onclick="calcular('restar')">Restar</button>
      <button class="multiplicar" onclick="calcular('multiplicar')">Multiplicar</button>
      <button class="dividir" onclick="calcular('dividir')">Dividir</button>
    </div>

    <div class="resultado" id="resultado">
      RESULTADO:
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
